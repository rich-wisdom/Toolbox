name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build app and unsigned x64 MSIX
      shell: pwsh
      run: .\build\Build-Installer.ps1 -Configuration Release -Platform x64

    - name: Upload unsigned installer for review
      uses: actions/upload-artifact@v4
      with:
        name: WindowsToolbox-unsigned-x64
        path: dist/*.msix*
        if-no-files-found: error
