name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'WindowsToolbox.sln'
  PACKAGE_PROJECT_PATH: 'src/WindowsToolbox.Package/WindowsToolbox.Package.wapproj'

jobs:
  build:
    name: Build MSIX Package
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86, ARM64]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,)'
      
      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } elseif ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } else {
            $version = '1.0.0'
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
      
      - name: Update version in manifest
        shell: pwsh
        run: |
          $manifestPath = "src/WindowsToolbox.Package/Package.appxmanifest"
          $version = "${{ steps.get_version.outputs.VERSION }}.0"
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = $version
          $manifest.Save($manifestPath)
          Write-Host "Updated manifest version to: $version"
      
      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      
      - name: Build solution
        run: |
          msbuild ${{ env.SOLUTION_PATH }} `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /maxcpucount `
            /verbosity:minimal
      
      - name: Find MSIX package
        id: find_package
        shell: pwsh
        run: |
          $packagePath = Get-ChildItem -Path "src/WindowsToolbox.Package/AppPackages" -Filter "*.msix" -Recurse |
            Where-Object { $_.Name -notlike "*_Test*" } |
            Select-Object -First 1 -ExpandProperty FullName
          
          if ($packagePath) {
            echo "PACKAGE_PATH=$packagePath" >> $env:GITHUB_OUTPUT
            echo "PACKAGE_NAME=$([System.IO.Path]::GetFileName($packagePath))" >> $env:GITHUB_OUTPUT
            Write-Host "Found package: $packagePath"
          } else {
            Write-Error "Package not found!"
            exit 1
          }
      
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsToolbox-${{ matrix.platform }}-${{ steps.get_version.outputs.VERSION }}
          path: ${{ steps.find_package.outputs.PACKAGE_PATH }}
          retention-days: 30
  
  bundle:
    name: Create MSIX Bundle
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } elseif ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } else {
            $version = '1.0.0'
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Create MSIX Bundle
        shell: pwsh
        run: |
          $makeappxPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"
          if (-not (Test-Path $makeappxPath)) {
            $makeappxPath = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Select-Object -First 1).FullName
          }
          
          New-Item -ItemType Directory -Force -Path "bundle"
          Get-ChildItem "artifacts" -Filter "*.msix" -Recurse | Copy-Item -Destination "bundle"
          
          & $makeappxPath bundle /d bundle /p WindowsToolbox_${{ steps.get_version.outputs.VERSION }}.msixbundle /bv ${{ steps.get_version.outputs.VERSION }}.0
      
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsToolbox-Bundle-${{ steps.get_version.outputs.VERSION }}
          path: '*.msixbundle'
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: WindowsToolbox-Bundle-${{ steps.get_version.outputs.VERSION }}
          path: release
      
      - name: Download individual packages
        uses: actions/download-artifact@v4
        with:
          path: release/packages
      
      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          $notes = @"
          # Windows Toolbox v${{ steps.get_version.outputs.VERSION }}
          
          ## Installation
          
          ### Quick Install (Recommended)
          1. Download ``WindowsToolbox_${{ steps.get_version.outputs.VERSION }}.msixbundle``
          2. Double-click to install
          3. If prompted, install the certificate first (see [INSTALL.md](docs/INSTALL.md))
          
          ### Individual Platforms
          Download the specific package for your architecture:
          - **x64** (Most PCs): ``WindowsToolbox-x64-${{ steps.get_version.outputs.VERSION }}.msix``
          - **x86** (32-bit): ``WindowsToolbox-x86-${{ steps.get_version.outputs.VERSION }}.msix``
          - **ARM64** (Surface Pro X): ``WindowsToolbox-ARM64-${{ steps.get_version.outputs.VERSION }}.msix``
          
          ## What's New
          
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          
          ## System Requirements
          
          - Windows 10 version 1809+ or Windows 11
          - .NET 8 Runtime (included in package)
          - 500 MB free disk space
          
          ## Documentation
          
          - [Installation Guide](docs/INSTALL.md)
          - [User Guide](docs/README.md)
          - [Troubleshooting](docs/TROUBLESHOOTING.md)
          
          ## Support
          
          - [Report Issues](https://github.com/rich-wisdom/Toolbox/issues)
          - [Discussions](https://github.com/rich-wisdom/Toolbox/discussions)
          
          ---
          
          **Full Changelog**: https://github.com/rich-wisdom/Toolbox/compare/v${{ steps.get_version.outputs.VERSION }}...v${{ steps.get_version.outputs.VERSION }}
          "@
          
          $notes | Out-File -FilePath release_notes.md -Encoding UTF8
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Windows Toolbox v${{ steps.get_version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            release/*.msixbundle
            release/packages/**/*.msix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  notify:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: release
    if: success()
    
    steps:
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Success notification
        run: |
          echo "✅ Release v${{ steps.get_version.outputs.VERSION }} created successfully!"
          echo "📦 Packages available at: https://github.com/rich-wisdom/Toolbox/releases/tag/v${{ steps.get_version.outputs.VERSION }}"
